<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Operator</title>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<h2>ОПЕРАТОР</h2>

<div style="display:flex;">

  <div id="users" style="width:200px;border-right:1px solid #ccc;"></div>

  <div style="flex:1;padding:10px;">

    <div id="chat"></div>

    <input id="msg" placeholder="Ответ">
    <button id="send">Отправить</button>

  </div>

</div>

<script>

const socket = io();

let selectedUser = null;

const usersDiv = document.getElementById("users");
const chat = document.getElementById("chat");
const msg = document.getElementById("msg");

socket.on("users", (users) => {

  usersDiv.innerHTML = "";

  users.forEach(u => {

    const div = document.createElement("div");
    div.style.padding = "5px";
    div.style.cursor = "pointer";
    div.innerText = "User: " + u;

    div.onclick = () => {
      selectedUser = u;
      chat.innerHTML = "";
      alert("Выбран: " + u);
    };

    usersDiv.appendChild(div);
  });

});

socket.on("new-message", (data) => {

  const div = document.createElement("div");
  div.style.margin = "5px 0";

  if (data.from === "operator") {
    div.innerHTML = "🧑‍💼 ОПЕРАТОР: " + data.text;
  } else {
    div.innerHTML = "👤 " + data.name + ": " + data.text;
  }

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
});

document.getElementById("send").onclick = () => {

  if (!selectedUser) {
    alert("Выбери пользователя");
    return;
  }

  if (!msg.value) return;

  socket.emit("operator-message", {
    userId: selectedUser,
    text: msg.value
  });

  msg.value = "";
};

</script>

</body>
</html>
