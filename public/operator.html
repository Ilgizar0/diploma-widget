<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Operator Panel</title>
<script src="/socket.io/socket.io.js"></script>
</head>

<body style="margin:0;display:flex;height:100vh;font-family:Arial;">

<!-- USERS -->
<div id="users" style="width:30%;border-right:1px solid #ccc;"></div>

<!-- CHAT -->
<div style="flex:1;display:flex;flex-direction:column;">

    <div id="messages" style="flex:1;overflow:auto;padding:10px;"></div>

    <div style="display:flex;">
        <input id="text" style="flex:1;padding:10px;">
        <button onclick="send()" style="padding:10px;">Send</button>
    </div>

</div>

<script>
const socket = io();

let users = {};
let selectedUser = null;
let messages = {};

socket.emit("join", "Operator");

// users list
socket.on("users", (data) => {
    users = data;
    renderUsers();
});

// messages
socket.on("new-message", (msg) => {

    if (!messages[msg.userId]) {
        messages[msg.userId] = [];
    }

    messages[msg.userId].push(msg);

    if (msg.userId === selectedUser) {
        renderMessages();
    }
});

function renderUsers() {

    const box = document.getElementById("users");
    box.innerHTML = "";

    Object.values(users).forEach(u => {

        const div = document.createElement("div");
        div.innerText = u.name;
        div.style.padding = "10px";
        div.style.cursor = "pointer";

        if (selectedUser === u.id) {
            div.style.background = "#eee";
        }

        div.onclick = () => {
            selectedUser = u.id;
            renderUsers();
            renderMessages();
        };

        box.appendChild(div);
    });
}

function renderMessages() {

    const box = document.getElementById("messages");
    box.innerHTML = "";

    if (!messages[selectedUser]) return;

    messages[selectedUser].forEach(m => {

        const div = document.createElement("div");

        if (m.from === "operator") {
            div.innerHTML = `<b>Оператор:</b> ${m.message}`;
        } else {
            div.innerHTML = `<b>${m.name}:</b> ${m.message}`;
        }

        box.appendChild(div);
    });

    box.scrollTop = box.scrollHeight;
}

function send() {

    const text = document.getElementById("text");

    if (!selectedUser) return;

    socket.emit("operator-message", {
        userId: selectedUser,
        message: text.value
    });

    text.value = "";
}
</script>

</body>
</html>
