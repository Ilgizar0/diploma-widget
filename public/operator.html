<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Operator Panel</title>

    <script src="/socket.io/socket.io.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            display: flex;
            height: 100vh;
        }

        /* Список пользователей */
        #users {
            width: 30%;
            border-right: 1px solid #ddd;
            overflow-y: auto;
        }

        .user {
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }

        .user:hover {
            background: #f5f5f5;
        }

        .active {
            background: #e8e8ff;
        }

        /* Чат */
        #chat {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
        }

        #inputBox {
            display: flex;
            border-top: 1px solid #ddd;
        }

        input {
            flex: 1;
            padding: 10px;
            border: none;
            outline: none;
        }

        button {
            padding: 10px 20px;
            border: none;
            background: #4f46e5;
            color: white;
            cursor: pointer;
        }

        .msg-user {
            text-align: right;
            margin: 5px;
            color: black;
        }

        .msg-operator {
            text-align: left;
            margin: 5px;
            color: #4f46e5;
        }
    </style>
</head>

<body>

<div id="users"></div>

<div id="chat">
    <div id="messages"></div>

    <div id="inputBox">
        <input id="text" placeholder="Сообщение...">
        <button onclick="send()">Send</button>
    </div>
</div>

<script>
const socket = io();

let selectedUser = null;
let allUsers = {};
let allMessages = {};

socket.emit("join", "Operator");

// получаем пользователей
socket.on("users", (users) => {
    allUsers = users;
    renderUsers();
});

// новые сообщения
socket.on("new-message", (data) => {
    if (!allMessages[data.userId]) {
        allMessages[data.userId] = [];
    }

    allMessages[data.userId].push(data);

    if (selectedUser === data.userId) {
        renderMessages();
    }
});

// список пользователей
function renderUsers() {
    const box = document.getElementById("users");
    box.innerHTML = "";

    Object.values(allUsers).forEach(u => {

        const div = document.createElement("div");
        div.className = "user";

        if (selectedUser === u.id) {
            div.classList.add("active");
        }

        div.innerText = u.name;

        div.onclick = () => {
            selectedUser = u.id;
            renderUsers();
            renderMessages();
        };

        box.appendChild(div);
    });
}

// сообщения
function renderMessages() {
    const box = document.getElementById("messages");
    box.innerHTML = "";

    if (!selectedUser) return;

    (allMessages[selectedUser] || []).forEach(m => {

        const div = document.createElement("div");

        if (m.from === "operator") {
            div.className = "msg-operator";
            div.innerText = "Оператор: " + m.message;
        } else {
            div.className = "msg-user";
            div.innerText = m.name + ": " + m.message;
        }

        box.appendChild(div);
    });
}

// отправка
function send() {
    const text = document.getElementById("text");

    if (!selectedUser) return;

    socket.emit("operator-message", {
        userId: selectedUser,
        message: text.value
    });

    text.value = "";
}
</script>

</body>
</html>
